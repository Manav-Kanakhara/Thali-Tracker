<style>
/* Layout: sticky running totals + tabs on top, food groups as dense tap-to-add lists below. Palette: green ink, spice orange for actions, one colour per nutrient. */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#13241C; --muted:#586A60; --line:#DCE3DB; --soft:#E9EFE7;
  --accent:#B8500F; --on-accent:#FFFFFF; --warn:#B3261E;
  --p:#1D6B4A; --c:#8A6500; --f:#4457A0; --fb:#7B3F8F; --w:#17708F;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211C; --ink:#E7EFE9; --muted:#98A99F; --line:#26352E; --soft:#1C2A24;
    --accent:#F09A5E; --on-accent:#1B0E05; --warn:#FF8F85;
    --p:#5CC49A; --c:#E0BE55; --f:#93A6EA; --fb:#CDA2E0; --w:#6CC0E6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --ink:#E7EFE9; --muted:#98A99F; --line:#26352E; --soft:#1C2A24;
  --accent:#F09A5E; --on-accent:#1B0E05; --warn:#FF8F85;
  --p:#5CC49A; --c:#E0BE55; --f:#93A6EA; --fb:#CDA2E0; --w:#6CC0E6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px}
.wrap{max-width:880px;margin-inline:auto;padding-block:18px 96px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,6vw,36px);line-height:1.05}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top p{color:var(--muted);max-width:52ch;margin-top:6px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);background:var(--surface);white-space:nowrap}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px 0;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.m{min-width:0}
.m-top{display:flex;flex-direction:column;line-height:1.15;margin-bottom:4px}
.m-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;white-space:nowrap}
.m-v small{color:var(--muted);font-size:11px}
.track{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--col);border-radius:99px;transition:width .3s}
.over .track i{background:var(--warn)}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;border:0;background:transparent;padding:10px 4px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

.view{padding-top:16px}
.ctl{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lab{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
input[type=search],input[type=number],input[type=date],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input[type=search]{flex:1 1 200px}

.grp{margin-bottom:22px}
.grp header{margin-bottom:8px}
.grp header p{color:var(--muted);font-size:13px;margin-top:2px;max-width:70ch}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.fn{font-weight:700}
.fs{font-size:13px;color:var(--muted)}
.fm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.fm .k{color:var(--ink);font-weight:500}.fm .p{color:var(--p)}.fm .c{color:var(--c)}.fm .f{color:var(--f)}.fm .fb{color:var(--fb)}
.add{grid-row:1/3;grid-column:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:22px;line-height:1;font-weight:700}
.add:active{transform:scale(.94)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav b{font-family:var(--display);font-size:19px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px}
.bigm{display:grid;gap:12px}
.bigm .m-top{flex-direction:row;justify-content:space-between;align-items:baseline}
.bigm .track{height:10px}
.left{font-size:12px;color:var(--muted);margin-top:3px}
.meal h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.meal h3 span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ent .fs{grid-column:1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.qty b{min-width:30px;text-align:center;font-family:var(--mono);font-size:13px}
.rm{border:0;background:transparent;color:var(--muted);width:30px;height:30px;font-size:18px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.link{border:0;background:transparent;color:var(--accent);padding:0;text-decoration:underline;font-weight:500}
.water{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.gl{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:1.5px solid var(--w);background:transparent}
.gl.on{background:var(--w)}

.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.alt{background:var(--soft);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.svgwrap{width:100%}
svg text{fill:var(--muted);font-family:var(--mono);font-size:9px}
svg .ink{fill:var(--ink)}
.cap{font-size:13px;color:var(--muted);margin-top:6px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
.tbl td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
.nut{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.nut .card{border-top:4px solid var(--col)}
.nut .big{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--col)}
.nut p{font-size:14px;margin-top:4px}
.nut .src{color:var(--muted);font-size:13px}
details.card summary{cursor:pointer;font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin-top:22px;max-width:75ch}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* recipes */
.rcp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;scroll-margin-top:140px}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;width:100%;text-align:left;background:transparent;border:0;padding:12px;border-radius:12px}
.rtitle{display:flex;flex-direction:column;min-width:0}
.rhead .fm{grid-column:1;grid-row:auto;margin-top:2px}
.chev{grid-row:1/3;grid-column:2;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;align-self:center}
.rbody{padding:12px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.steps{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.tbl.ing td:first-child{white-space:normal;font-weight:500}
.tbl.ing td:last-child{color:var(--muted)}
.tipx{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;max-width:70ch}
@media (min-width:640px){
  .m-top{flex-direction:row;justify-content:space-between;align-items:baseline}
  .m-v{font-size:14px}
  .food{grid-template-columns:minmax(0,1fr) auto auto;}
  .fm{grid-column:auto;grid-row:1/3;grid-template-columns:none;margin-top:0}
  .add{grid-column:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Thali Tracker</h1>
      <p>Every food in grams, sorted by what it does for you, plus recipes with exact ingredient weights. Tap + to log it and watch your day fill up.</p>
    </div>
    <span class="pill" id="status">Loading</span>
  </div>

  <div class="sticky">
    <div class="mini" id="mini"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-act="tab" data-v="foods">Foods</button>
      <button class="tab" role="tab" data-act="tab" data-v="recipes">Recipes</button>
      <button class="tab" role="tab" data-act="tab" data-v="today">Today</button>
      <button class="tab" role="tab" data-act="tab" data-v="progress">Progress</button>
      <button class="tab" role="tab" data-act="tab" data-v="guide">Guide</button>
    </div>
  </div>

  <main class="view" id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function calc(ings,div){
  var t={k:0,p:0,c:0,f:0,fb:0};div=div||1;
  ings.forEach(function(x){var d=DB[x[0]];if(!d)throw new Error('Unknown ingredient '+x[0]);var m=x[1]/100;
    t.k+=d[1]*m;t.p+=d[2]*m;t.c+=d[3]*m;t.f+=d[4]*m;t.fb+=d[5]*m;});
  for(var k in t)t[k]=t[k]/div;
  return t;
}

st:['Pressure cook dal with 400 ml water and turmeric for 4 whistles. Mash.','Boil the vegetables and onion in 500 ml water with salt for 8 minutes.','Add tamarind water, sambar powder and the dal. Simmer 10 minutes.','Heat oil, add mustard, hing and curry leaves, and pour into the sambar. Add coriander.'],tip:'One serving is about 1 big bowl. Pair with idli for a classic, filling meal.'},
{n:'Idli',cu:'Indian',cat:'Breakfast',t:30,sv:4,ing:[['rice',200,'idli rice, soaked 6 hours'],['urad',60,'soaked 6 hours'],['methiseed',1,'soaked with the dal'],['salt',4,'to taste']],
st:['Grind urad dal and methi with cold water to a light, fluffy batter. Grind the rice separately to a slightly coarse batter.','Mix both with salt and ferment 8 to 12 hours in a warm place until doubled.','Grease idli plates, fill each mould three quarters full.','Steam 10 to 12 minutes. Rest 2 minutes before removing.'],tip:'Makes 16 idlis. One serving is 4 idlis. Eat with sambar for protein and fibre.'},
{n:'Moong sprouts chaat',cu:'Indian',cat:'Snack',t:10,sv:1,ing:[['sprmoong',150,'lightly steamed or raw'],['tomato',50,'chopped'],['onion',30,'chopped'],['cucumber',50,'chopped'],['pomegranate',20,''],['chilli',2,'chopped'],['coriander',5,'chopped'],['lemon',10,'2 tsp juice'],['spicemix',2,'chaat masala'],['salt',1,'to taste']],
st:['Steam the sprouts 3 minutes if you prefer them softer. Cool.','Mix everything in a bowl.','Add lemon, chaat masala and salt just before eating so it stays crunchy.'],tip:'To sprout: soak 80 g whole moong 8 hours, drain, and keep covered 12 to 24 hours.'},
{n:'Roasted masala makhana',cu:'Indian',cat:'Snack',t:10,sv:1,ing:[['makhana',30,'about 1 1/2 cups'],['ghee',4,'1 tsp'],['spicemix',1,'chaat masala'],['pepper',0.5,'a pinch'],['salt',0.5,'a pinch']],
st:['Dry roast makhana on low heat for 6 to 8 minutes, stirring, until one crushes with a crisp snap.','Add ghee and toss 1 minute.','Turn off the heat, add chaat masala, pepper and salt, and toss.'],tip:'Keeps crisp for a week in an airtight jar.'},
{n:'Sattu drink',cu:'Indian',cat:'Drink',t:3,sv:1,ing:[['sattu',40,'4 tbsp'],['water',250,'chilled'],['lemon',15,'1 tbsp juice'],['cumin',1,'roasted, powdered'],['mint',2,'a few leaves'],['salt',1,'black salt']],
st:['Whisk sattu into a little water to make a paste with no lumps.','Add the rest of the water, lemon, roasted cumin and black salt.','Stir well and add mint.'],tip:'A natural, cheap protein drink. Have it after the gym or as an evening snack.'},
{n:'Hung curd berry bowl',cu:'Foreign',cat:'Breakfast',t:5,sv:1,ing:[['hungcurd',200,''],['blueberry',50,'or strawberries'],['almond',10,'about 8, chopped'],['chia',6,'2 tsp'],['honey',5,'1 tsp, optional'],['cinnamon',0.5,'a pinch']],
st:['To make hung curd, strain about 400 g curd in a muslin cloth in the fridge for 4 hours.','Spoon into a bowl and top with berries, almonds, chia and cinnamon.','Drizzle the honey if using.'],tip:'Any seasonal fruit works: papaya, apple or pomegranate.'},
{n:'Overnight oats with chia',cu:'Foreign',cat:'Breakfast',t:5,sv:1,ing:[['oats',40,'rolled'],['milk',150,'cow milk'],['hungcurd',50,''],['chia',8,'2 tsp'],['banana',60,'half, sliced'],['almond',8,'about 6'],['cinnamon',0.5,'a pinch']],
st:['Mix oats, milk, hung curd, chia and cinnamon in a jar.','Cover and refrigerate overnight, at least 6 hours.','In the morning top with banana and chopped almonds.'],tip:'Make 3 jars at once to cover 3 mornings.'},
{n:'Banana oat pancakes',cu:'Foreign',cat:'Breakfast',t:15,sv:1,ing:[['oats',40,'blended to flour'],['egg',100,'2 large eggs'],['banana',60,'ripe, half'],['cinnamon',0.5,'a pinch'],['oil',3,'for the pan']],
st:['Blend oats, eggs, banana and cinnamon into a thick batter. Rest 5 minutes.','Heat a non-stick pan on medium-low and brush with oil.','Pour 3 small pancakes, cook 2 minutes until bubbles appear, flip, cook 1 minute.','Repeat with the rest of the batter.'],tip:'Top with 50 g hung curd and berries instead of syrup.'},
{n:'Egg curry',cu:'Indian',cat:'Main',t:35,sv:2,ing:[['egg',300,'6 large eggs, boiled'],['onion',120,'chopped'],['tomato',150,'pureed'],['ginger',6,'grated'],['garlic',8,'4 cloves'],['oil',14,'about 3 tsp'],['cumin',1,'1/2 tsp'],['turmeric',1,'1/4 tsp'],['chillip',2,'1/2 tsp'],['corianderp',3,'1 1/2 tsp'],['spicemix',2,'garam masala'],['coriander',10,'chopped'],['water',200,''],['salt',3,'to taste']],
st:['Boil the eggs 9 minutes, peel and make 2 small slits on each.','Heat oil, add cumin, then onion. Cook 7 minutes until golden.','Add ginger, garlic, tomato and powders. Cook 6 minutes until thick.','Add water and salt, simmer 5 minutes, then add eggs and simmer 5 minutes more.','Finish with garam masala and coriander.'],tip:'For more protein with less fat, use 4 whole eggs and 4 extra boiled whites.'},
{n:'Chickpea and egg salad',cu:'Foreign',cat:'Salad',t:15,sv:1,ing:[['egg',100,'2 large eggs, boiled'],['chana',30,'dry, about 75 g boiled'],['cucumber',80,'diced'],['tomato',60,'diced'],['onion',30,'diced'],['lemon',15,'1 tbsp juice'],['olive',5,'1 tsp'],['coriander',5,'chopped'],['pepper',0.5,'crushed'],['salt',1,'to taste']],
st:['Cook soaked chickpeas until soft (or use leftover boiled chana). Cool.','Chop the eggs and vegetables.','Whisk lemon, olive oil, salt and pepper and toss everything together.'],tip:'Pack it for lunch. It keeps well for a day in the fridge.'},
{n:'Tofu bhurji',cu:'Indian',cat:'Breakfast',t:15,sv:1,ing:[['tofu',150,'crumbled'],['onion',40,'chopped'],['tomato',50,'chopped'],['capsicum',30,'chopped'],['chilli',2,'chopped'],['oil',5,'1 tsp'],['cumin',1,'1/2 tsp'],['turmeric',1,'1/4 tsp'],['spicemix',1,'pav bhaji or garam masala'],['coriander',5,'chopped'],['salt',1,'to taste']],
st:['Squeeze excess water from the tofu and crumble it.','Heat oil, add cumin, then onion and chilli. Cook 2 minutes.','Add capsicum, tomato, turmeric and salt. Cook 3 minutes.','Add tofu and masala and cook 3 to 4 minutes until dry and fluffy.','Finish with coriander.'],tip:'Turmeric gives the same yellow look as egg bhurji.'},
{n:'Quinoa vegetable pulao',cu:'Foreign',cat:'Main',t:30,sv:2,ing:[['quinoa',100,'rinsed well'],['peas',60,''],['carrot',60,'diced'],['beans',40,'chopped'],['onion',60,'sliced'],['ginger',5,'grated'],['oil',8,'about 2 tsp'],['cumin',2,'1 tsp'],['spicemix',2,'garam masala'],['coriander',10,'chopped'],['water',200,''],['salt',2,'to taste']],
st:['Rinse quinoa in a fine strainer for 1 minute to remove bitterness.','Heat oil, add cumin, onion and ginger. Cook 3 minutes.','Add vegetables and garam masala and cook 3 minutes.','Add quinoa, salt and water. Cover and cook on low for 15 minutes.','Rest 5 minutes, fluff, and add coriander.'],tip:'Eat with 100 g paneer or tofu tikka to make it a high-protein plate.'},
{n:'Vegetable dalia upma',cu:'Indian',cat:'Breakfast',t:25,sv:2,ing:[['dalia',80,'roasted 3 minutes'],['onion',50,'chopped'],['carrot',50,'diced'],['beans',40,'chopped'],['peas',40,''],['peanut',15,''],['oil',8,'about 2 tsp'],['mustard',1,'1/4 tsp'],['curryleaf',2,'a sprig'],['ginger',4,'grated'],['chilli',3,'chopped'],['lemon',10,'2 tsp juice'],['coriander',5,'chopped'],['water',350,''],['salt',2,'to taste']],
st:['Dry roast dalia for 3 minutes and set aside.','Heat oil, roast peanuts, add mustard, curry leaves, ginger and chilli.','Add onion and vegetables and cook 4 minutes.','Add dalia, salt and hot water. Cover and cook on low 12 minutes, or 2 whistles in a cooker.','Finish with lemon and coriander.'],tip:'Dalia is high in fibre, so it keeps you full until lunch.'},
{n:'Lauki soup',cu:'Indian',cat:'Soup',t:25,sv:2,ing:[['doodhi',300,'peeled, cubed'],['onion',40,'chopped'],['garlic',5,'2 cloves'],['ginger',5,'small piece'],['chilli',2,''],['oil',5,'1 tsp'],['pepper',1,'crushed'],['coriander',10,''],['water',400,''],['salt',2,'to taste']],
st:['Heat oil and cook onion, garlic, ginger and chilli for 3 minutes.','Add doodhi and water and pressure cook 2 whistles.','Blend with coriander until smooth.','Reheat, season with salt and pepper.'],tip:'Very low in calories. Have it before dinner to fill up.'},
{n:'Tofu and vegetable clear soup',cu:'Asian',cat:'Soup',t:20,sv:2,ing:[['tofu',100,'cubed'],['broccoli',80,'small florets'],['carrot',40,'sliced thin'],['mushroom',60,'sliced'],['cabbage',60,'shredded'],['garlic',5,'chopped'],['ginger',5,'chopped'],['soy',10,'2 tsp'],['oil',5,'1 tsp'],['cornflour',4,'mixed in 2 tbsp water'],['pepper',0.5,''],['coriander',5,''],['water',600,''],['salt',1,'to taste']],
st:['Heat oil and cook garlic and ginger 1 minute.','Add carrot, mushroom and cabbage and cook 2 minutes.','Add water and soy sauce and bring to a boil. Add broccoli and tofu and simmer 4 minutes.','Stir in the cornflour slurry and simmer 1 minute until slightly thick.','Season with pepper and salt and add coriander.'],tip:'Soy sauce is salty, so taste before adding salt.'},
{n:'Mediterranean chickpea paneer salad',cu:'Foreign',cat:'Salad',t:15,sv:2,ing:[['chana',60,'dry, about 150 g boiled'],['paneer',60,'cubed'],['cucumber',150,'diced'],['tomato',150,'diced'],['onion',40,'sliced'],['lettuce',50,'torn'],['mint',5,'chopped'],['olive',15,'1 tbsp'],['lemon',20,'juice of 1/2 lemon'],['pepper',1,'crushed'],['salt',1,'to taste']],
st:['Boil soaked chickpeas until soft and cool them.','Whisk olive oil, lemon, salt, pepper and mint.','Toss chickpeas, paneer and vegetables with the dressing.'],tip:'Use paneer like feta. Crumble it for a creamier salad.'},
{n:'Shakshuka',cu:'Foreign',cat:'Breakfast',t:25,sv:2,ing:[['egg',200,'4 large eggs'],['tomato',400,'chopped'],['bellpep',100,'chopped'],['onion',80,'chopped'],['garlic',8,'4 cloves'],['olive',10,'2 tsp'],['cumin',2,'1 tsp'],['chillip',2,'paprika or chilli powder'],['coriander',10,'chopped'],['salt',2,'to taste']],
st:['Heat oil in a wide pan, cook onion and pepper 5 minutes.','Add garlic and spices for 1 minute, then tomato and salt. Simmer 10 minutes until thick.','Make 4 wells and crack an egg into each.','Cover and cook on low for 5 to 7 minutes until the whites set.','Top with coriander.'],tip:'Mop it up with a slice of whole wheat bread if you want carbs.'},
{n:'Spinach mushroom egg muffins',cu:'Foreign',cat:'Breakfast',t:30,sv:2,ing:[['egg',250,'5 large eggs'],['spinach',60,'chopped'],['mushroom',100,'chopped'],['onion',40,'chopped'],['paneer',40,'crumbled'],['oil',5,'for greasing and sauteing'],['pepper',0.5,''],['salt',1,'to taste']],
st:['Heat the oven or air fryer to 180 C. Grease 6 muffin moulds.','Saute mushroom and onion in a little oil for 4 minutes, add spinach until wilted.','Whisk eggs with salt and pepper, stir in vegetables and paneer.','Divide into the moulds and bake 18 to 20 minutes until set.'],tip:'Makes 6. Keeps 3 days in the fridge, so breakfast is ready in 1 minute.'},
{n:'Tofu vegetable stir-fry',cu:'Asian',cat:'Main',t:20,sv:2,ing:[['tofu',200,'pressed, cubed'],['broccoli',150,'florets'],['bellpep',100,'sliced'],['carrot',80,'sliced'],['garlic',8,'chopped'],['ginger',8,'chopped'],['soy',20,'4 tsp'],['oil',10,'2 tsp'],['sesame',6,'2 tsp'],['pepper',0.5,'']],
st:['Pan fry the tofu in half the oil on high for 6 minutes until golden. Set aside.','Add the rest of the oil, garlic and ginger, then all vegetables. Stir-fry 4 minutes on high.','Add tofu and soy sauce and toss 1 minute.','Finish with sesame and pepper.'],tip:'Eat with 1/2 cup brown rice or quinoa.'},
{n:'Hummus with veggie sticks',cu:'Foreign',cat:'Snack',t:20,sv:4,ing:[['chana',100,'dry, soaked and boiled very soft'],['sesame',40,'toasted, ground into tahini'],['olive',15,'1 tbsp'],['lemon',30,'2 tbsp juice'],['garlic',5,'2 cloves'],['cumin',1,'1/2 tsp'],['water',60,'ice cold'],['salt',2,'to taste'],['cucumber',200,'sticks'],['carrot',200,'sticks']],
st:['Grind the toasted sesame into a paste with a little olive oil.','Blend chickpeas, sesame paste, lemon, garlic, cumin and salt.','Stream in the cold water while blending until very smooth.','Drizzle with the remaining olive oil and serve with cucumber and carrot sticks.'],tip:'One serving is about 3 tbsp hummus with half the veggie sticks per person.'},
{n:'Masoor lentil soup',cu:'Foreign',cat:'Soup',t:30,sv:2,ing:[['masoor',80,'washed'],['carrot',60,'diced'],['onion',50,'chopped'],['tomato',80,'chopped'],['garlic',5,'2 cloves'],['oil',6,'about 1 tsp'],['cumin',1,'1/2 tsp'],['lemon',10,'2 tsp juice'],['pepper',0.5,''],['water',700,''],['salt',3,'to taste']],
st:['Heat oil and cook onion, garlic and carrot for 4 minutes.','Add cumin, tomato, lentils and water. Simmer 20 minutes until soft.','Blend half the soup for a creamy texture and stir back.','Season with salt, pepper and lemon.'],tip:'A bowl gives solid protein for very little fat.'},
{n:'Instant ragi dosa',cu:'Indian',cat:'Breakfast',t:20,sv:2,ing:[['ragi',100,''],['curd',60,''],['onion',30,'finely chopped'],['coriander',5,'chopped'],['chilli',2,'chopped'],['cumin',1,'1/2 tsp'],['oil',8,'for the tawa'],['water',220,''],['salt',2,'to taste']],
st:['Mix ragi, curd, salt and water into a thin, pourable batter. Rest 10 minutes.','Stir in onion, coriander, chilli and cumin.','Pour a ladle onto a hot tawa from a height, filling the gaps, like rava dosa.','Drizzle oil and cook on medium 3 minutes until crisp. Fold and serve.'],tip:'Ragi is rich in calcium. Eat with 2 eggs or sambar for protein.'},
{n:'Peanut banana smoothie',cu:'Foreign',cat:'Drink',t:5,sv:1,ing:[['milk',250,'cold cow milk'],['banana',100,'1 medium'],['pbutter',16,'1 tbsp'],['oats',20,''],['cinnamon',0.5,'a pinch']],
st:['Blend everything for 45 seconds until smooth.','Add a few ice cubes if you like it colder.'],tip:'A good post-gym drink when a meal is more than 2 hours away.'},
{n:'Masala chaas',cu:'Gujarati',cat:'Drink',t:5,sv:1,ing:[['curd',80,''],['water',170,'cold'],['cumin',1,'roasted, powdered'],['mint',3,'a few leaves'],['coriander',3,''],['salt',1,'black salt']],
st:['Blend curd, water, mint and coriander for 20 seconds.','Stir in roasted cumin and black salt.'],tip:'Have it with lunch. It helps digestion and fills you up.'},
{n:'Egg fried rice',cu:'Asian',cat:'Main',t:20,sv:1,ing:[['rice',60,'cooked a day ahead and chilled'],['egg',100,'2 large eggs'],['carrot',40,'diced small'],['beans',40,'chopped'],['peas',30,''],['onion',30,'chopped'],['garlic',5,'chopped'],['soy',10,'2 tsp'],['oil',8,'about 2 tsp'],['pepper',0.5,''],['salt',0.5,'a pinch']],
st:['Cook the rice and chill it, ideally overnight, so the grains stay separate.','Heat half the oil on high, scramble the eggs and set aside.','Add the rest of the oil, garlic and onion, then vegetables. Stir-fry 3 minutes.','Add rice, soy sauce and pepper and toss 2 minutes. Fold in the eggs.'],tip:'Use a wide pan on high heat. A crowded pan turns fried rice soggy.'},
{n:'Rajma burrito bowl',cu:'Mexican',cat:'Main',t:20,sv:1,ing:[['brownrice',50,'dry, cooked'],['rajma',40,'dry, cooked'],['corn',40,'boiled'],['tomato',60,'diced for salsa'],['onion',30,'diced'],['lettuce',40,'shredded'],['avocado',40,'sliced'],['hungcurd',40,'instead of sour cream'],['lemon',10,'2 tsp juice'],['cumin',1,'1/2 tsp'],['chillip',0.5,'a pinch'],['coriander',5,'chopped'],['salt',1,'to taste']],
st:['Warm the cooked rajma with cumin, chilli powder and salt, mashing a little.','Mix tomato, onion, coriander and lemon for a quick salsa.','Layer rice, lettuce, rajma, corn and salsa in a bowl.','Top with avocado and hung curd.'],tip:'Use leftover rajma and rice from dinner.'},
{n:'Date and nut energy balls',cu:'Foreign',cat:'Sweet',t:15,sv:4,ing:[['dates',100,'pitted, about 8 to 10'],['almond',30,''],['walnut',20,''],['oats',20,'lightly roasted'],['coconut',10,'grated'],['cinnamon',1,'1/2 tsp']],
st:['Pulse almonds, walnuts and oats into a coarse powder.','Add dates and cinnamon and pulse into a sticky dough.','Roll into 8 balls and coat with coconut.','Refrigerate 30 minutes to firm up.'],tip:'Two balls is one serving. A better sweet than mithai, but still calorie dense.'},
{n:'Dalia kheer, low sugar',cu:'Indian',cat:'Sweet',t:30,sv:2,ing:[['milk',400,'cow milk'],['dalia',40,'roasted in 1/2 tsp ghee'],['ghee',2,'1/2 tsp'],['jaggery',20,'or 4 chopped dates'],['almond',10,'sliced'],['cinnamon',0.3,'or cardamom']],
st:['Roast dalia in ghee for 3 minutes.','Add milk and simmer on low for 20 minutes, stirring often, until soft and creamy.','Turn off the heat, wait 2 minutes, then stir in jaggery so the milk does not split.','Top with almonds and cardamom.'],tip:'Better than a mithai craving, but keep it to once or twice a week.'},
{n:'Mint coriander chutney',cu:'Indian',cat:'Side',t:5,sv:4,ing:[['mint',30,'leaves'],['coriander',30,'with stems'],['chilli',5,'2 small'],['garlic',3,'1 clove'],['lemon',15,'1 tbsp juice'],['hungcurd',40,'for a creamy version'],['cumin',1,'roasted'],['salt',2,'to taste']],
st:['Blend mint, coriander, chilli, garlic, lemon, cumin and salt with 2 tbsp cold water.','Stir in hung curd.'],tip:'About 2 tbsp per serving. Lifts any tikka, chilla or salad for almost no calories.'},
{n:'Methi besan pudla',cu:'Gujarati',cat:'Breakfast',t:15,sv:1,ing:[['besan',50,''],['methi',30,'chopped'],['curd',30,''],['water',40,''],['ginger',3,'grated'],['chilli',2,'chopped'],['turmeric',0.5,'a pinch'],['sesame',3,'1 tsp'],['oil',5,'1 tsp'],['salt',1,'to taste']],
st:['Mix besan, curd, water, methi, ginger, chilli, turmeric, sesame and salt into a thick pouring batter.','Spread on a hot non-stick tawa in two rounds.','Drizzle oil around the edges and cook 2 minutes on each side until crisp.'],tip:'All the flavour of methi thepla without the roti. Serve with curd.'},
{n:'Lobia (chora) curry',cu:'Gujarati',cat:'Main',t:40,sv:2,ing:[['lobia',80,'soaked 6 hours'],['onion',60,'chopped'],['tomato',120,'chopped'],['garlic',6,'3 cloves'],['ginger',4,'grated'],['oil',10,'2 tsp'],['cumin',1,'1/2 tsp'],['turmeric',1,'1/4 tsp'],['chillip',1,'1/4 tsp'],['corianderp',2,'1 tsp'],['jaggery',3,'optional'],['lemon',10,'2 tsp juice'],['coriander',10,'chopped'],['water',450,''],['salt',3,'to taste']],
st:['Pressure cook soaked lobia with 450 ml water and salt for 3 whistles.','Heat oil, add cumin, onion, ginger and garlic. Cook 5 minutes.','Add tomato and powders. Cook 5 minutes.','Add lobia with water and jaggery, simmer 8 minutes.','Finish with lemon and coriander.'],tip:'Chora is a Gujarati staple with as much protein as rajma and cooks faster.'},
{n:'Dalia moong khichdi',cu:'Gujarati',cat:'Main',t:30,sv:2,ing:[['dalia',50,'or broken jowar'],['moongdal',50,''],['onion',40,'chopped'],['tomato',60,'chopped'],['peas',40,''],['carrot',40,'diced'],['ghee',8,'about 2 tsp'],['cumin',2,'1 tsp'],['turmeric',1,'1/4 tsp'],['ginger',4,'grated'],['water',600,''],['salt',3,'to taste']],
st:['Wash dalia and dal together and drain.','Heat ghee in a cooker, add cumin, ginger and onion. Cook 3 minutes.','Add tomato, vegetables, turmeric, dalia, dal, salt and water.','Pressure cook 4 whistles and let it rest.'],tip:'More fibre than rice khichdi, so it keeps you full longer.'}
];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ds(d);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function r1(n){return Math.round(n*10)/10;}

}

/* ---------- storage: shared db when granted, this device otherwise ---------- */
var store={db:null,mode:'local',unsubs:[],
  init:function(){
    var self=this;
    return Promise.resolve().then(function(){
      if(window.claude&&window.claude.use){return window.claude.use('db');}
      return null;
    }).then(function(d){self.db=d||null;}).catch(function(){self.db=null;});
  },
  local:function(coll,cb){
    var m={};try{m=JSON.parse(localStorage.getItem('tt:'+coll)||'{}');}catch(e){}
    this.mode='local';cb(m);return function(){};
  },
  sub:function(coll,cb){
    var self=this;
    if(this.db){
      try{
        this.mode='db';
        return this.db.collection(coll).onSnapshot(function(s){
          var m={};s.docs.forEach(function(d){m[d.id]=d.data();});cb(m);
        },function(){self.local(coll,cb);setStatus();});
      }catch(e){}
    }
    return this.local(coll,cb);
  },
  put:function(coll,id,data){
    var self=this;
    var local=function(){
      try{var m=JSON.parse(localStorage.getItem('tt:'+coll)||'{}');m[id]=data;localStorage.setItem('tt:'+coll,JSON.stringify(m));}catch(e){}
    };
    if(this.db&&this.mode==='db'){
      return this.db.doc(coll+'/'+id).set(data).catch(function(){self.mode='local';local();setStatus();toast('Could not reach the shared store, saved on this device');});
    }
    local();return Promise.resolve();
  }
};

function saveDay(day){state.days[state.date]=day;refresh();store.put('days',state.date,day);}

/* ---------- actions ---------- */
function addFood(id){
  var f=FOOD[id];if(!f)return;
  var day=clone(curDay());day.entries=day.entries||[];
  var hit=null;
  day.entries.forEach(function(e){if(e.id===id&&e.m===state.meal){hit=e;}});
  if(hit){hit.q=r1(hit.q+1);}
  else{day.entries.push({id:id,n:f.n,s:f.s,m:state.meal,q:1,k:f.k,p:f.p,c:f.c,f:f.f,fb:f.fb});}
  saveDay(day);
  var mn=MEALS.filter(function(m){return m[0]===state.meal;})[0][1];
  toast('Added '+f.n+' to '+mn.toLowerCase());
}
function changeQty(i,delta){
  var day=clone(curDay());var e=day.entries[i];if(!e)return;
  e.q=r1(e.q+delta);
  if(e.q<=0){day.entries.splice(i,1);}
  saveDay(day);
}
function removeEntry(i){var day=clone(curDay());day.entries.splice(i,1);saveDay(day);}
function changeWater(d){var day=clone(curDay());day.entries=day.entries||[];day.water=Math.max(0,(day.water||0)+d);saveDay(day);}

var METERS=[['k','Calories','kcal','var(--accent)'],['p','Protein','g','var(--p)'],['c','Carbs','g','var(--c)'],['f','Fat','g','var(--f)'],['fb','Fibre','g','var(--fb)']];
function meterHTML(key,label,unit,col,val,target,big){
  var pct=Math.min(100,target?val/target*100:0);
  var over=(key==='k'||key==='f')&&val>target*1.05;
  var v=key==='k'?r0(val):r1(val);
  var left=target-val;
  var note='';
  if(big){
    if(key==='p'||key==='fb'){note=left>0?r0(left)+' '+unit+' to go':'Target reached';}
    else{note=left>=0?r0(left)+' '+unit+' left':r0(-left)+' '+unit+' over';}
  }
  return '<div class="m'+(over?' over':'')+'" style="--col:'+col+'"><div class="m-top"><span class="m-l">'+label+'</span><span class="m-v">'+v+'<small>/'+target+(big?' '+unit:'')+'</small></span></div><div class="track" role="progressbar" aria-label="'+label+'" aria-valuemin="0" aria-valuemax="'+target+'" aria-valuenow="'+r0(val)+'"><i style="width:'+pct+'%"></i></div>'+(big?'<div class="left">'+note+'</div>':'')+'</div>';
}

function weightChart(rows){
  var W=320,H=180,L=34,R=12,T=14,B=24,goal=65,start=84;
  var kgs=rows.map(function(r){return r.kg;});
  var lo=Math.min.apply(null,[goal-1].concat(kgs)),hi=Math.max.apply(null,[start+1].concat(kgs));
  var y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B);};
  var x=function(i){return rows.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(rows.length-1);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weight over time with a goal of 65 kg">';
  for(var v=Math.ceil(lo/5)*5;v<=hi;v+=5){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';}
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(start)+'" y2="'+y(start)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(y(start)-4)+'" text-anchor="end">start 84</text>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(goal)+'" y2="'+y(goal)+'" stroke="var(--p)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(y(goal)-4)+'" text-anchor="end" style="fill:var(--p)">goal 65</text>';
  if(rows.length>1){s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="'+rows.map(function(r,i){return x(i)+','+y(r.kg);}).join(' ')+'"/>';}
  rows.forEach(function(r,i){s+='<circle cx="'+x(i)+'" cy="'+y(r.kg)+'" r="3.5" fill="var(--accent)"/>';});
  if(rows.length){var last=rows[rows.length-1];s+='<text class="ink" x="'+Math.min(x(rows.length-1),W-R-14)+'" y="'+(y(last.kg)-9)+'" text-anchor="middle">'+last.kg+'</text>';
    s+='<text x="'+L+'" y="'+(H-6)+'">'+fmtDate(rows[0].d).replace(/^\w+, /,'')+'</text>';
    if(rows.length>1)s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDate(last.d).replace(/^\w+, /,'')+'</text>';}
  return s+'</svg>';
}
function weekChart(){
  var T=state.targets;var W=320,H=170,L=6,R=6,Tp=16,B=40;
  var days=[];for(var i=6;i>=0;i--)days.push(shift(TODAY,-i));
  var tot=days.map(function(d){return totals(state.days[d]||{entries:[]});});
  var mx=Math.max.apply(null,[T.k*1.25].concat(tot.map(function(t){return t.k;})));
  var bw=(W-L-R)/7,ph=H-Tp-B;
  var ty=H-B-(T.k/mx)*ph;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Calories per day for the last 7 days against the target">';
  days.forEach(function(d,i){
    var h=(tot[i].k/mx)*ph;var bx=L+i*bw+bw*0.18,w=bw*0.64;
    s+='<rect x="'+bx+'" y="'+(H-B-h)+'" width="'+w+'" height="'+Math.max(h,1)+'" rx="3" fill="var(--accent)" opacity="'+(tot[i].k?0.9:0.35)+'"/>';
    if(tot[i].k)s+='<text class="ink" x="'+(bx+w/2)+'" y="'+(H-B-h-4)+'" text-anchor="middle">'+r0(tot[i].k)+'</text>';
    s+='<text x="'+(bx+w/2)+'" y="'+(H-B+13)+'" text-anchor="middle">'+parse(d).toLocaleDateString('en-IN',{weekday:'narrow'})+'</text>';
    s+='<text x="'+(bx+w/2)+'" y="'+(H-B+27)+'" text-anchor="middle" style="fill:'+(tot[i].p>=T.p?'var(--p)':'var(--muted)')+'">P'+r0(tot[i].p)+'</text>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ty+'" y2="'+ty+'" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/><text x="'+L+'" y="'+(ty-4)+'">target '+T.k+'</text>';
  return {svg:s+'</svg>',hit:tot.filter(function(t){return t.p>=T.p;}).length,logged:tot.filter(function(t){return t.k>0;}).length};
}
function fillProgress(){
  var rows=Object.keys(state.body).sort().map(function(d){return {d:d,kg:Number(state.body[d].kg)};}).filter(function(r){return r.kg>0;});
  $('#wchart').innerHTML=weightChart(rows);
  var cap;
  if(!rows.length){cap='No readings yet. Save your first weight above and the line starts here.';}
  else{
    var first=rows[0],last=rows[rows.length-1];
    var lost=r1(first.kg-last.kg);
    cap='Latest '+last.kg+' kg, '+r1(last.kg-65)+' kg above goal.'+(rows.length>1?' Change since first reading: '+(lost>=0?'down ':'up ')+Math.abs(lost)+' kg.':'');
  }
  var waists=Object.keys(state.body).sort().filter(function(d){return state.body[d].waist;});
  if(waists.length)cap+=' Waist '+state.body[waists[waists.length-1]].waist+' cm.';
  $('#wcap').textContent=cap;
  var wk=weekChart();
  $('#kchart').innerHTML=wk.svg;
  $('#kcap').textContent=wk.logged?('Protein target hit on '+wk.hit+' of the last '+wk.logged+' logged days. Green P numbers show the days you reached it.'):'Log meals in the Foods tab and your week fills in here.';
}

/* ---------- recipes tab ---------- */
var RID2FOOD={};Object.keys(FOOD).forEach(function(id){if(FOOD[id].rid)RID2FOOD[FOOD[id].rid]=id;});
var RCATS=[['all','All'],['Breakfast','Breakfast'],['Main','Lunch and dinner'],['Snack','Snacks'],['Soup','Soups'],['Salad','Salads'],['Drink','Drinks'],['Sweet','Sweets'],['Side','Chutneys']];
var RCUIS=[['all','All cuisines'],['Gujarati','Gujarati'],['Indian','Indian'],['Asian','Asian'],['Foreign','International']];
function cuLabel(c){return c==='Foreign'?'International':c;}
function fmtG(g){return g>=10?String(Math.round(g)):String(Math.round(g*10)/10);}
function chips(list,act,cur,seg){return '<div class="seg" id="'+seg+'">'+list.map(function(x){return '<button class="chip" data-act="'+act+'" data-v="'+x[0]+'" aria-pressed="'+(cur===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';}
function pressSeg(seg,v){var cs=document.querySelectorAll('#'+seg+' .chip');for(var k=0;k<cs.length;k++)cs[k].setAttribute('aria-pressed',String(cs[k].getAttribute('data-v')===v));}
function viewRecipes(){
  var meals=MEALS.map(function(m){return '<button class="chip" data-act="meal" data-v="'+m[0]+'" aria-pressed="'+(state.meal===m[0])+'">'+m[1]+'</button>';}).join('');
  $('#view').innerHTML=
    '<div class="ctl">'+
      '<div class="row"><span class="lab">Log to</span><div class="seg" id="mealSeg">'+meals+'</div></div>'+
      '<div class="row"><input type="search" id="rq" placeholder="Search a dish or ingredient, e.g. paneer, moong" aria-label="Search recipes" value="'+esc(state.rq)+'">'+
      '<select id="rsort" aria-label="Sort recipes"><option value="az">Sort: A to Z</option><option value="prot">Most protein first</option><option value="ratio">Most protein per calorie</option><option value="kcal">Fewest calories first</option></select></div>'+
      chips(RCATS,'rcat',state.rcat,'rcatSeg')+
      '<div class="row">'+chips(RCUIS,'rcu',state.rcu,'rcuSeg')+
      '<div class="seg"><button class="chip" data-act="rflag" data-v="hp" aria-pressed="'+state.rhp+'">20 g+ protein</button><button class="chip" data-act="rflag" data-v="low" aria-pressed="'+state.rlow+'">Under 300 kcal</button></div></div>'+
    '</div><p class="cap" id="rcount"></p><div id="recList"></div>'+
    '<p class="note">Nutrition per serving is calculated from the raw or dry weight of every ingredient (USDA FoodData Central and IFCT 2017 values), then divided by the number of servings. Weigh ingredients raw for the most accurate numbers. Real food varies by variety and brand, so expect about 5 to 10% difference.</p>';
  $('#rsort').value=state.rsort;
  fillRecipes();
}
function recipeCard(r){
  var open=!!state.ropen[r.id],p=r.per;
  var macros='<span class="k">'+r0(p.k)+' kcal</span><span class="p">P '+r1(p.p)+'</span><span class="c">C '+r1(p.c)+'</span><span class="f">F '+r1(p.f)+'</span><span class="fb">Fibre '+r1(p.fb)+'</span>';
  var h='<article class="rcp" id="card_'+r.id+'"><button class="rhead" data-act="rtoggle" data-v="'+r.id+'" aria-expanded="'+open+'">'+
    '<span class="rtitle"><span class="fn">'+esc(r.n)+'</span><span class="fs">'+cuLabel(r.cu)+' &middot; '+r.t+' min &middot; serves '+r.sv+' &middot; per serving</span></span>'+
    '<span class="fm">'+macros+'</span><span class="chev" aria-hidden="true">'+(open?'&#9652;':'&#9662;')+'</span></button>';
  if(open){
    var sv=state.rscale[r.id]||r.sv,m=sv/r.sv;
    var raw=0,wat=0;r.ing.forEach(function(x){if(x[0]==='water')wat+=x[1]*m;else raw+=x[1]*m;});
    h+='<div class="rbody">'+
      '<div class="row"><span class="lab">Cooking for</span><div class="qty"><button data-act="rserv" data-v="'+r.id+'" data-d="-1" aria-label="Fewer servings">&minus;</button><b>'+sv+'</b><button data-act="rserv" data-v="'+r.id+'" data-d="1" aria-label="More servings">+</button></div><span class="fs">'+(sv===1?'serving':'servings')+', '+Math.round(raw)+' g ingredients'+(wat?' plus '+Math.round(wat)+' ml water':'')+'</span></div>'+
      '<div class="scroll"><table class="tbl ing"><thead><tr><th>Ingredient</th><th>Amount</th><th>Note</th></tr></thead><tbody>'+
      r.ing.map(function(x){var d=DB[x[0]];return '<tr><td>'+esc(d[0])+'</td><td class="num">'+fmtG(x[1]*m)+(x[0]==='water'?' ml':' g')+'</td><td>'+esc(x[2]||'')+'</td></tr>';}).join('')+
      '</tbody></table></div>'+
      '<div><h3>Method</h3><ol class="steps">'+r.st.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol></div>'+
      (r.tip?'<p class="tipx">'+esc(r.tip)+'</p>':'')+
      '<p class="fs">Whole batch of '+sv+': '+r0(r.per.k*sv)+' kcal, protein '+r1(r.per.p*sv)+' g, carbs '+r1(r.per.c*sv)+' g, fat '+r1(r.per.f*sv)+' g, fibre '+r1(r.per.fb*sv)+' g.</p>'+
      '<div><button class="btn" data-act="add" data-v="'+RID2FOOD[r.id]+'">Log 1 serving</button></div>'+
    '</div>';
  }
  return h+'</article>';
}
function fillRecipes(){
  var q=state.rq.trim().toLowerCase();
  var list=RECIPES.filter(function(r){
    if(state.rcat!=='all'&&r.cat!==state.rcat)return false;
    if(state.rcu!=='all'){if(state.rcu==='Foreign'){if(r.cu!=='Foreign'&&r.cu!=='Mexican')return false;}else if(r.cu!==state.rcu)return false;}
    if(state.rhp&&r.per.p<20)return false;
    if(state.rlow&&r.per.k>=300)return false;
    if(q){var hay=(r.n+' '+r.cu+' '+r.ing.map(function(x){return DB[x[0]][0];}).join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  if(state.rsort==='prot')list.sort(function(a,b){return b.per.p-a.per.p;});
  else if(state.rsort==='ratio')list.sort(function(a,b){return b.per.p/b.per.k-a.per.p/a.per.k;});
  else if(state.rsort==='kcal')list.sort(function(a,b){return a.per.k-b.per.k;});
  else list.sort(function(a,b){return a.n.localeCompare(b.n);});
  $('#rcount').textContent=list.length+' of '+RECIPES.length+' recipes. Tap one to see ingredients in grams and the method.';
  $('#recList').innerHTML=list.map(recipeCard).join('')||'<p class="empty">No recipe matches. Clear a filter or try a shorter word.</p>';
}

/* ---------- routing and refresh ---------- */
function renderTabs(){
  var btns=document.querySelectorAll('#tabs .tab');
  for(var i=0;i<btns.length;i++){btns[i].setAttribute('aria-selected',String(btns[i].getAttribute('data-v')===state.tab));}
}
function show(tab){
  state.tab=tab;renderTabs();
  if(tab==='foods')viewFoods();else if(tab==='recipes')viewRecipes();else if(tab==='today')viewToday();else if(tab==='progress')viewProgress();else viewGuide();
  window.scrollTo(0,0);
}
function refresh(){
  renderMini();
  if(state.tab==='today')fillToday();
  else if(state.tab==='progress')fillProgress();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),i=Number(el.getAttribute('data-i'));
  if(a==='tab')show(v);
  else if(a==='group'){state.group=v;var cs=document.querySelectorAll('#grpSeg .chip');for(var k=0;k<cs.length;k++)cs[k].setAttribute('aria-pressed',String(cs[k].getAttribute('data-v')===v));fillFoods();}
  else if(a==='meal'){state.meal=v;var ms=document.querySelectorAll('#mealSeg .chip');for(var j=0;j<ms.length;j++)ms[j].setAttribute('aria-pressed',String(ms[j].getAttribute('data-v')===v));}
  else if(a==='rtoggle'){state.ropen[v]=!state.ropen[v];fillRecipes();}
  else if(a==='rserv'){var rr=RECIPES.filter(function(x){return x.id===v;})[0];var cur=state.rscale[v]||rr.sv;state.rscale[v]=Math.max(1,Math.min(20,cur+Number(el.getAttribute('data-d'))));fillRecipes();}
  else if(a==='rcat'){state.rcat=v;pressSeg('rcatSeg',v);fillRecipes();}
  else if(a==='rcu'){state.rcu=v;pressSeg('rcuSeg',v);fillRecipes();}
  else if(a==='rflag'){if(v==='hp')state.rhp=!state.rhp;else state.rlow=!state.rlow;el.setAttribute('aria-pressed',String(v==='hp'?state.rhp:state.rlow));fillRecipes();}
  else if(a==='openrecipe'){state.ropen[v]=true;state.rcat='all';state.rcu='all';state.rq='';state.rhp=false;state.rlow=false;show('recipes');var card=document.getElementById('card_'+v);if(card)card.scrollIntoView({block:'start'});}
  else if(a==='export'){exportData();}
  else if(a==='add')addFood(v);
  else if(a==='qty')changeQty(i,Number(v));
  else if(a==='rm')removeEntry(i);
  else if(a==='water')changeWater(Number(v));
  else if(a==='day'){state.date=shift(state.date,Number(v));if(state.date>TODAY)state.date=TODAY;refresh();}
  else if(a==='goadd'){state.meal=v;show('foods');}
  else if(a==='savebody'){
    var d=$('#bd').value||TODAY,kg=parseFloat($('#bk').value),w=parseFloat($('#bw').value);
    if(!(kg>0)){toast('Enter your weight in kg first');return;}
    var rec={kg:r1(kg)};if(w>0)rec.waist=r1(w);
    saveBody(d,rec);$('#bk').value='';$('#bw').value='';toast('Saved '+rec.kg+' kg');
  }
  else if(a==='savetargets'){
    var t={};['k','p','c','f','fb','w'].forEach(function(key){var n=parseFloat($('#t_'+key).value);t[key]=n>0?n:DEFAULT_T[key];});
    saveTargets(t);toast('Targets saved');
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){state.q=ev.target.value;fillFoods();}
  if(ev.target.id==='rq'){state.rq=ev.target.value;fillRecipes();}
});
function readLS(k){try{return JSON.parse(localStorage.getItem('tt:'+k)||'{}');}catch(e){return {};}}
function exportData(){
  var data={app:'thali-tracker',version:1,exported:new Date().toISOString(),days:readLS('days'),body:readLS('body'),settings:readLS('settings')};
  var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thali-backup-'+TODAY+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  toast('Backup saved to your downloads');
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.app!=='thali-tracker'||typeof d.days!=='object')throw new Error('bad');
      ['days','body','settings'].forEach(function(k){localStorage.setItem('tt:'+k,JSON.stringify(d[k]||{}));});
      state.days=d.days||{};state.body=d.body||{};
      if(d.settings&&d.settings.targets)state.targets=Object.assign({},DEFAULT_T,d.settings.targets);
      show(state.tab);toast('Restored '+Object.keys(state.days).length+' days of logs');
    }catch(e){toast('That file is not a Thali Tracker backup');}
  };
  r.readAsText(file);
}
document.addEventListener('change',function(ev){
  if(ev.target.id==='importFile'&&ev.target.files&&ev.target.files[0]){importData(ev.target.files[0]);ev.target.value='';}
  if(ev.target.id==='sort'){state.sort=ev.target.value;fillFoods();}
  if(ev.target.id==='rsort'){state.rsort=ev.target.value;fillRecipes();}
});

/* ---------- roll over to the new day at midnight, even if the app stays open ---------- */
function checkDay(){
  var now=ds(new Date());
  if(now===TODAY)return;
  var wasToday=state.date===TODAY;
  TODAY=now;if(wasToday)state.date=now;
  state.meal=autoMeal();show(state.tab);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkDay();});
window.addEventListener('focus',checkDay);
setInterval(checkDay,30000);

/* ---------- boot ---------- */
renderTabs();renderMini();viewFoods();setStatus();
store.init().then(function(){
  store.sub('days',function(m){state.days=m;refresh();});
  store.sub('body',function(m){state.body=m;refresh();});
  store.sub('settings',function(m){if(m.targets){state.targets=Object.assign({},DEFAULT_T,m.targets);}refresh();if(state.tab==='guide')viewGuide();});
  setStatus();
});
})();
</script>
